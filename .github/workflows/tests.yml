name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install uv==0.9.7
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python -m pytest
      - run: node --test browser-extension/tests/*.test.mjs
      - run: uv run --no-sync python -m playwright install chromium
      - run: uv run --no-sync python scripts/source_unavailable_dom_smoke.py
      - run: uv run --no-sync python scripts/gallery_dom_smoke.py
      - run: uv run --no-sync python scripts/browser_smoke.py
      - run: uv run --no-sync python scripts/images_smoke.py
      - run: uv run --no-sync python scripts/panel_smoke.py
      - run: uv run --no-sync python scripts/popup_window_smoke.py
      - run: uv run --no-sync python scripts/package.py
