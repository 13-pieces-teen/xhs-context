[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xhs-context"
version = "0.4.0a1"
description = "Local Xiaohongshu archive, evidence retrieval and browser batch import"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.27,<1", "jieba==0.42.1", "Pillow>=10,<13"]

[project.optional-dependencies]
ocr = ["rapidocr>=3,<4", "onnxruntime>=1.20,<2"]

[project.scripts]
xhs-context = "xhs_context.cli:main"
xhs-context-native = "xhs_context.native:main"

[dependency-groups]
dev = [
    "playwright>=1.56,<2",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

